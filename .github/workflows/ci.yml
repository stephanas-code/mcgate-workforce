name: Build and Push McGate Workforce

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # DOCKER HUB LOGIN
      # ============================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ============================================================
      # SETUP BUILDX
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # BUILD AND PUSH
      # ============================================================
      - name: Build and Push Multi-Stage Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            mcgatehub/mcgate-workforce:${{ github.sha }}
            mcgatehub/mcgate-workforce:latest

      # ============================================================
      # VERIFY IMAGE EXISTS
      # ============================================================
      - name: Verify Docker image
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="mcgatehub/mcgate-workforce:${IMAGE_TAG}"

          echo "=========================================="
          echo "VERIFYING DOCKER IMAGE"
          echo "=========================================="
          echo "Image: $IMAGE"
          echo ""

          docker pull "$IMAGE"

          echo ""
          echo "Image successfully pushed and verified:"
          echo "$IMAGE"

      # ============================================================
      # TRIGGER CD (KUBERNETES DEPLOYMENT)
      # ============================================================
      - name: Trigger Kubernetes Deployment
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          CD_REPO_TOKEN: ${{ secrets.CD_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TRIGGERING KUBERNETES DEPLOYMENT"
          echo "=========================================="

          # If CD_REPO_TOKEN is configured for an external CD repo, dispatch:
          if [ -n "${CD_REPO_TOKEN:-}" ]; then
            echo "Dispatching to CD repository..."
            curl -L \
              -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${CD_REPO_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/McGateEnt/mcgate-workforce-cd/dispatches" \
              -d "{\"event_type\":\"update-deployment\",\"client_payload\":{\"image_tag\":\"${IMAGE_TAG}\",\"app_image\":\"mcgatehub/mcgate-workforce:${IMAGE_TAG}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"commit\":\"${GITHUB_SHA}\"}}" \
              || echo "Note: External dispatch skipped if repo not found."
          fi

          echo "Image tag for deployment: ${IMAGE_TAG}"
